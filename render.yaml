services:
  - type: web
    name: aquamind-backend
    env: python
    plan: free
    region: oregon
    buildCommand: python -m pip install --upgrade pip && python -m pip install -r server/requirements.txt
    startCommand: gunicorn server.app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHONUNBUFFERED
        value: 1
    healthCheckPath: /
    autoDeploy: true
